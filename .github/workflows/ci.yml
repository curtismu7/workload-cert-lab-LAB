name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: Install server deps
        run: npm install --prefix server express supertest --no-save
      - name: Server tests
        run: node --test server/test/*.test.js
      - name: Web build
        run: npm install --prefix web && npm run build --prefix web
      - name: Forbidden strings
        run: echo "checked via repo secret in gitleaks-style job below"

  forbidden-strings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check forbidden strings
        env:
          FORBIDDEN_STRINGS: ${{ secrets.FORBIDDEN_STRINGS }}
        run: |
          if [ -z "$FORBIDDEN_STRINGS" ]; then echo "FORBIDDEN_STRINGS secret not set"; exit 1; fi
          ! grep -rFf <(echo "$FORBIDDEN_STRINGS") --include='*' --exclude-dir=node_modules --exclude-dir=.git .

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  attribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: bash scripts/check-no-ai-attribution.sh
